<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="570" viewBox="0 0 1200 570" role="img" aria-labelledby="t d" font-family="IBM Plex Sans, Segoe UI, Arial, sans-serif">
  <title id="t">An illustrative one-page data map</title>
  <desc id="d">An invented example. Each box records the data item's format, owner and update rate, and where relevant its tag and units, how long it is kept, who uses it and known problems. Spindle load from a CNC machine, an OPC UA tag in percent updated every second, goes automatically to a historian kept for 12 months, then to a weekly OEE report sent as a PDF. Downtime reasons are written on a paper form, re-keyed the next morning into an Excel spreadsheet with no named owner whose reasons vary by shift, then copied by hand into the report. ERP work orders, pulled weekly as JSON through an API, also feed the report. The spreadsheet is marked as the point where trust breaks.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#1b1f23"/>
    </marker>
  </defs>
  <rect width="1200" height="570" fill="#ecece7"/>

  <g font-size="14" fill="#3c413b">
    <rect x="30" y="30" width="250" height="140" fill="#ffffff" stroke="#d5d5ce"/>
    <text x="46" y="60" font-size="16" font-weight="600" fill="#1b1f23">CNC spindle load</text>
    <text x="46" y="86">Tag S3_LOAD, unit %</text>
    <text x="46" y="108">Format: OPC UA</text>
    <text x="46" y="130">Owner: maintenance</text>
    <text x="46" y="152">Updates: every second</text>

    <rect x="30" y="200" width="250" height="140" fill="#ffffff" stroke="#d5d5ce"/>
    <text x="46" y="230" font-size="16" font-weight="600" fill="#1b1f23">Downtime reason sheet</text>
    <text x="46" y="256">Format: paper form</text>
    <text x="46" y="278">Owner: shift leads</text>
    <text x="46" y="300">Updates: each stop</text>

    <rect x="30" y="370" width="250" height="140" fill="#ffffff" stroke="#d5d5ce"/>
    <text x="46" y="400" font-size="16" font-weight="600" fill="#1b1f23">ERP work orders</text>
    <text x="46" y="426">Format: JSON via API</text>
    <text x="46" y="448">Owner: planning</text>
    <text x="46" y="470">Updates: each order</text>

    <rect x="475" y="30" width="250" height="140" fill="#ffffff" stroke="#d5d5ce"/>
    <text x="491" y="60" font-size="16" font-weight="600" fill="#1b1f23">Historian</text>
    <text x="491" y="86">Format: time series</text>
    <text x="491" y="108">Custodian: controls team</text>
    <text x="491" y="130">Kept for 12 months</text>

    <rect x="475" y="200" width="250" height="140" fill="#ffffff" stroke="#f2b705" stroke-width="4"/>
    <text x="491" y="230" font-size="16" font-weight="600" fill="#1b1f23">Downtime spreadsheet</text>
    <text x="491" y="256">Format: Excel</text>
    <text x="491" y="278">Owner: nobody named</text>
    <text x="491" y="300">Updates: next morning</text>
    <text x="491" y="322">Issue: reasons vary by shift</text>

    <rect x="920" y="200" width="250" height="140" fill="#ffffff" stroke="#d5d5ce"/>
    <text x="936" y="230" font-size="16" font-weight="600" fill="#1b1f23">Weekly OEE report</text>
    <text x="936" y="256">Format: PDF by email</text>
    <text x="936" y="278">Used by: operations meeting</text>
    <text x="936" y="300">Updates: every Monday</text>
  </g>

  <g stroke="#1b1f23" stroke-width="2" marker-end="url(#arrow)" fill="none">
    <line x1="282" y1="100" x2="471" y2="100"/>
    <line x1="727" y1="130" x2="916" y2="230"/>
    <line x1="282" y1="270" x2="471" y2="270"/>
    <line x1="727" y1="270" x2="916" y2="270"/>
    <line x1="282" y1="440" x2="916" y2="320"/>
  </g>

  <g font-size="13" fill="#62675f">
    <text x="376" y="90" text-anchor="middle">Automatic</text>
    <text x="376" y="260" text-anchor="middle">Re-keyed next morning</text>
    <text x="821" y="260" text-anchor="middle">Copied by hand</text>
    <text x="600" y="404" text-anchor="middle">Weekly API pull</text>
  </g>

  <rect x="30" y="532" width="18" height="18" fill="#ffffff" stroke="#f2b705" stroke-width="4"/>
  <text x="60" y="547" font-size="14" fill="#3c413b">Where trust breaks. An invented example of a one-page data map, not a real plant.</text>
</svg>
