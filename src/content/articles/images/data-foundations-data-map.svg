<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" role="img" aria-labelledby="t d" font-family="IBM Plex Sans, Segoe UI, Arial, sans-serif">
  <title id="t">An illustrative one-page data map</title>
  <desc id="d">An invented example. Spindle load from a CNC machine goes to a historian, then to a weekly OEE report. Downtime reasons are written on a paper sheet, re-keyed into a spreadsheet the next morning, then copied into the report. ERP work orders also feed the report. The spreadsheet has no named owner and is marked as the point where trust breaks.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#1b1f23"/>
    </marker>
  </defs>
  <rect width="1200" height="520" fill="#ecece7"/>

  <g font-size="14" fill="#3c413b">
    <rect x="30" y="40" width="250" height="100" fill="#ffffff" stroke="#d5d5ce"/>
    <text x="46" y="72" font-size="16" font-weight="600" fill="#1b1f23">CNC spindle load</text>
    <text x="46" y="98">Owner: maintenance</text>
    <text x="46" y="122">Updates: every second</text>

    <rect x="30" y="200" width="250" height="100" fill="#ffffff" stroke="#d5d5ce"/>
    <text x="46" y="232" font-size="16" font-weight="600" fill="#1b1f23">Downtime reason sheet</text>
    <text x="46" y="258">Owner: shift leads</text>
    <text x="46" y="282">Updates: each stop, on paper</text>

    <rect x="30" y="360" width="250" height="100" fill="#ffffff" stroke="#d5d5ce"/>
    <text x="46" y="392" font-size="16" font-weight="600" fill="#1b1f23">ERP work orders</text>
    <text x="46" y="418">Owner: planning</text>
    <text x="46" y="442">Updates: each order</text>

    <rect x="475" y="40" width="250" height="100" fill="#ffffff" stroke="#d5d5ce"/>
    <text x="491" y="72" font-size="16" font-weight="600" fill="#1b1f23">Historian</text>
    <text x="491" y="98">Custodian: controls team</text>
    <text x="491" y="122">Kept for a year</text>

    <rect x="475" y="200" width="250" height="100" fill="#ffffff" stroke="#f2b705" stroke-width="4"/>
    <text x="491" y="232" font-size="16" font-weight="600" fill="#1b1f23">Downtime spreadsheet</text>
    <text x="491" y="258">Owner: nobody named</text>
    <text x="491" y="282">Reasons vary by shift</text>

    <rect x="920" y="200" width="250" height="100" fill="#ffffff" stroke="#d5d5ce"/>
    <text x="936" y="232" font-size="16" font-weight="600" fill="#1b1f23">Weekly OEE report</text>
    <text x="936" y="258">Used by: operations meeting</text>
    <text x="936" y="282">Updates: every Monday</text>
  </g>

  <g stroke="#1b1f23" stroke-width="2" marker-end="url(#arrow)" fill="none">
    <line x1="282" y1="90" x2="471" y2="90"/>
    <line x1="727" y1="110" x2="916" y2="214"/>
    <line x1="282" y1="250" x2="471" y2="250"/>
    <line x1="727" y1="250" x2="916" y2="250"/>
    <line x1="282" y1="410" x2="916" y2="286"/>
  </g>

  <g font-size="13" fill="#62675f">
    <text x="376" y="80" text-anchor="middle">Automatic</text>
    <text x="376" y="240" text-anchor="middle">Re-keyed next morning</text>
    <text x="821" y="240" text-anchor="middle">Copied by hand</text>
    <text x="600" y="372" text-anchor="middle">Weekly export</text>
  </g>

  <rect x="30" y="482" width="18" height="18" fill="#ffffff" stroke="#f2b705" stroke-width="4"/>
  <text x="60" y="497" font-size="14" fill="#3c413b">Where trust breaks. An invented example of a one-page data map, not a real plant.</text>
</svg>
