# Pull-request checks (docs/deployment.md explains the whole pipeline).
#
#   build          unit tests, the production-configuration build, browser tests;
#                  uploads the built site as the "site" artifact
#   gitleaks       scans the PR's commits for secrets
#   accessibility  deploys that exact build to an SWA preview, then runs axe,
#                  routing and Lighthouse checks against it
#   close-preview  deletes the preview when the PR closes, freeing its slot
#
# PRs from forks and Dependabot get no secrets, so they skip the preview jobs.
# GitHub counts a skipped required check as passing.
name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened, closed]

permissions:
  contents: read

jobs:
  build:
    name: build
    if: github.event.action != 'closed'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      - run: npm test
      # The same configuration as production, minus analytics: no PD_* overrides,
      # so it builds the real (currently empty) articles folder.
      - run: npm run build
        env:
          PUBLIC_SHOW_DRAFTS: 'false'
          PUBLIC_ALLOW_INDEXING: 'false'
          PUBLIC_CF_WEB_ANALYTICS_TOKEN: ''
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: site
          path: dist
          retention-days: 7
          if-no-files-found: error
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report-build
          path: playwright-report
          retention-days: 7
          if-no-files-found: ignore

  gitleaks:
    name: gitleaks
    if: github.event.action != 'closed'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read # the action lists the PR's commits through the API
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: false
          # The same version runbook 05 installs locally (the action would
          # otherwise download whatever is newest).
          GITLEAKS_VERSION: 8.30.1

  accessibility:
    name: accessibility
    needs: build
    if: >-
      github.event.action != 'closed' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.user.login != 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: write # the SWA action comments the preview URL on the PR
    # A new push to the PR cancels the older run, so two deploys never race
    # for the same preview.
    concurrency:
      group: preview-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: site
          path: dist
      - id: deploy
        uses: Azure/static-web-apps-deploy@1a947af9992250f3bc2e68ad0754c0b0c11566c9 # v1
        with:
          action: upload
          app_location: dist
          output_location: ''
          skip_app_build: true
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
      - run: npx playwright install --with-deps chromium
      - run: npm run test:deployed
        env:
          PD_DEPLOYED_URL: ${{ steps.deploy.outputs.static_web_app_url }}
      # Still runs when test:deployed fails, so both reports exist; skipped when
      # the deploy itself failed, so that failure is the one you see.
      - if: ${{ !cancelled() && steps.deploy.outcome == 'success' }}
        run: npm run test:lighthouse
        env:
          PD_DEPLOYED_URL: ${{ steps.deploy.outputs.static_web_app_url }}
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: preview-reports
          path: |
            lighthouse-report
            playwright-report
          retention-days: 7
          if-no-files-found: ignore

  close-preview:
    if: >-
      github.event.action == 'closed' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.user.login != 'dependabot[bot]'
    runs-on: ubuntu-latest
    # Same group as the preview deploy: closing the PR cancels a deploy still in
    # progress before deleting the preview, so the deploy can't recreate it.
    concurrency:
      group: preview-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    timeout-minutes: 10
    steps:
      - uses: Azure/static-web-apps-deploy@1a947af9992250f3bc2e68ad0754c0b0c11566c9 # v1
        with:
          action: close
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
