# Production deploy (docs/deployment.md explains the whole pipeline).
#
# Runs on every push to main (a merged PR) and on demand from the Actions tab
# ("Run workflow"). Unit tests and the build must pass before anything is
# deployed; after the deploy, the deployed-site checks run against the live
# site, so a broken deploy turns the run red.
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# One production deploy at a time. A second merge waits for the first deploy
# to finish rather than cancelling it halfway.
concurrency:
  group: production
  cancel-in-progress: false

jobs:
  deploy-production:
    # "Run workflow" lets you pick any branch; only main may reach production.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      - run: npm test
      # Indexing stays off until launch (plan 3). The analytics token is a
      # public repository variable; when it's unset the build has no beacon.
      - run: npm run build
        env:
          PUBLIC_SHOW_DRAFTS: 'false'
          PUBLIC_ALLOW_INDEXING: 'false'
          PUBLIC_CF_WEB_ANALYTICS_TOKEN: ${{ vars.PUBLIC_CF_WEB_ANALYTICS_TOKEN }}
      - id: deploy
        uses: Azure/static-web-apps-deploy@1a947af9992250f3bc2e68ad0754c0b0c11566c9 # v1
        with:
          action: upload
          app_location: dist
          output_location: ''
          skip_app_build: true
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
      - run: npx playwright install --with-deps chromium
      - run: npm run test:deployed
        env:
          PD_DEPLOYED_URL: ${{ steps.deploy.outputs.static_web_app_url }}
          PD_EXPECT_ANALYTICS: ${{ vars.PUBLIC_CF_WEB_ANALYTICS_TOKEN != '' && 'true' || 'false' }}
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report-production
          path: playwright-report
          retention-days: 7
          if-no-files-found: ignore
