# Shared first steps for every job: the Node version named in .nvmrc, with
# npm's download cache, then a clean install from package-lock.json.
# Jobs check out the repository before using this (it lives in the repo).
name: Set up Node and dependencies
description: Install the Node version from .nvmrc and run npm ci.
runs:
  using: composite
  steps:
    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version-file: .nvmrc
        cache: npm
    - run: npm ci
      shell: bash
